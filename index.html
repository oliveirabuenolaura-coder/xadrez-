
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xadrez</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2f3542;
            color: #f1f2f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin-top: 15px;
        }

        h1 { 
            margin-bottom: 10px; 
            color: #fff;
            font-weight: 600;
        }

        /* TELA INICIAL (MENU) */
        #start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #3f4451;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 1px solid #57606f;
            margin-top: 20px;
            width: 320px;
        }

        #start-screen h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #fff;
            font-size: 1.3rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            width: 100%;
            margin-bottom: 12px;
            gap: 4px;
        }

        .input-group label {
            font-size: 0.85rem;
            color: #ced6e0;
        }

        .input-group input, .input-group select {
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #57606f;
            background-color: #2f3542;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #81b64c;
        }

        .btn-start {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background-color: #81b64c;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-start:hover {
            background-color: #6fa03f;
            transform: scale(1.02);
        }

        /* TELA DO JOGO */
        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        /* PAINEL COMPACTO DOS JOGADORES (LADO A LADO) */
        #players-panel {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 12px;
            width: 100%;
            max-width: 536px;
        }

        .player {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 14px;
            border-radius: 6px;
            background-color: #3f4451;
            border: 1px solid #57606f;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            flex: 1;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .score-badge {
            font-size: 0.8rem;
            color: #f1c40f;
            font-weight: bold;
            background-color: rgba(0,0,0,0.25);
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
            white-space: nowrap;
        }

        .active-player {
            background-color: #81b64c !important;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(129, 182, 76, 0.4);
            border-color: #81b64c;
        }

        .active-player .score-badge {
            color: #fff;
            background-color: rgba(0,0,0,0.2);
        }

        #status-bar {
            margin-bottom: 12px;
            font-size: 1rem;
            height: 20px;
            color: #f1f2f6;
            font-weight: 500;
        }

        #board-wrapper {
            padding: 10px;
            background-color: #2b1d13;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 10px rgba(0,0,0,0.5);
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 65px);
            grid-template-rows: repeat(8, 65px);
            border: 2px solid #1a110b;
        }

        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        .square img {
            width: 56px;
            height: 56px;
            pointer-events: none;
            z-index: 2;
            filter: drop-shadow(0px 4px 4px rgba(0, 0, 0, 0.35));
            transition: transform 0.1s ease;
        }

        .square:hover img {
            transform: scale(1.05);
        }

        .light { background-color: #f0d9b5; }
        .dark { background-color: #b58863; }
        
        .square:hover { filter: brightness(95%); }

        .selected {
            background-color: rgba(247, 247, 105, 0.6) !important;
        }

        .last-move {
            background-color: rgba(186, 202, 43, 0.5) !important;
        }

        .possible-move::after {
            content: '';
            width: 18px;
            height: 18px;
            background-color: rgba(0, 0, 0, 0.25);
            border-radius: 50%;
            position: absolute;
            z-index: 3;
            pointer-events: none;
        }

        .possible-capture::after {
            content: '';
            width: 52px;
            height: 52px;
            border: 4px solid rgba(255, 71, 87, 0.7);
            border-radius: 50%;
            position: absolute;
            z-index: 3;
            pointer-events: none;
        }

        .controls-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-control {
            padding: 8px 16px;
            font-size: 13px;
            background-color: #57606f;
            color: #dde1e6;
            border: 1px solid #747d8c;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .btn-control:hover {
            background-color: #747d8c;
            color: #fff;
        }
    </style>
</head>
<body>

    <h1>Xadrez</h1>

    <div id="start-screen">
        <h2>Configurar Partida</h2>
        
        <div class="input-group">
            <label for="mode-select">Modo de Jogo:</label>
            <select id="mode-select" onchange="handleModeChange()">
                <option value="pvp">👥 2 Jogadores (Local)</option>
                <option value="bot">🤖 Jogar contra Robô (IA)</option>
            </select>
        </div>

        <div class="input-group">
            <label for="color-select">Escolha suas Peças (Jogador 1):</label>
            <select id="color-select">
                <option value="w" selected>⚪ Brancas (Primeiro a jogar)</option>
                <option value="b">⚫ Pretas (Segundo a jogar)</option>
            </select>
        </div>

        <div class="input-group" id="difficulty-group" style="display: none;">
            <label for="difficulty-select">Nível do Robô:</label>
            <select id="difficulty-select">
                <option value="easy">🟢 Fácil</option>
                <option value="medium" selected>🟡 Médio</option>
                <option value="hard">🔴 Difícil</option>
            </select>
        </div>

        <div class="input-group">
            <label for="p1-name-input">Nome Jogador 1:</label>
            <input type="text" id="p1-name-input" value="Jogador 1" placeholder="Digite o nome...">
        </div>

        <div class="input-group">
            <label for="p2-name-input">Nome Jogador 2:</label>
            <input type="text" id="p2-name-input" value="Jogador 2" placeholder="Digite o nome...">
        </div>

        <button class="btn-start" onclick="startGame()">▶️ Iniciar Jogo</button>
    </div>

    <div id="game-screen">
        <div id="players-panel">
            <div id="p1" class="player active-player">
                <span id="p1-name" class="player-info">⚪ Jogador 1</span>
                <span id="p1-score" class="score-badge">0 pts</span>
            </div>
            <div id="p2" class="player">
                <span id="p2-name" class="player-info">⚫ Jogador 2</span>
                <span id="p2-score" class="score-badge">0 pts</span>
            </div>
        </div>

        <div id="status-bar">Sua vez!</div>

        <div id="board-wrapper">
            <div id="board"></div>
        </div>

        <div class="controls-container">
            <button class="btn-control" onclick="resetGame()">Reiniciar Partida</button>
            <button class="btn-control" onclick="goToMenu()">⚙️ Voltar ao Menu</button>
        </div>
    </div>

    <script>
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const boardHtml = document.getElementById('board');
        const statusBar = document.getElementById('status-bar');
        const p1Div = document.getElementById('p1');
        const p2Div = document.getElementById('p2');
        const p1NameSpan = document.getElementById('p1-name');
        const p2NameSpan = document.getElementById('p2-name');
        const p1ScoreSpan = document.getElementById('p1-score');
        const p2ScoreSpan = document.getElementById('p2-score');
        const modeSelect = document.getElementById('mode-select');
        const colorSelect = document.getElementById('color-select');
        const difficultyGroup = document.getElementById('difficulty-group');
        const difficultySelect = document.getElementById('difficulty-select');
        const p1Input = document.getElementById('p1-name-input');
        const p2Input = document.getElementById('p2-name-input');
        
        let chess = new Chess();
        let selectedSquare = null;
        let lastMoveSquares = [];
        let p1Name = "Jogador 1";
        let p2Name = "Jogador 2";
        let humanColor = 'w';

        const pieceValues = { 'p': 1, 'n': 3, 'b': 3, 'r': 5, 'q': 9, 'k': 0 };

        function playMoveSound() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, ctx.currentTime);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        }

        const pieceImages = {
            'p': { 'w': 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg', 'b': 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg' },
            'r': { 'w': 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg', 'b': 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg' },
            'n': { 'w': 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg', 'b': 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg' },
            'b': { 'w': 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg', 'b': 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg' },
            'q': { 'w': 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg', 'b': 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg' },
            'k': { 'w': 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg', 'b': 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg' }
        };

        const columns = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
        const rows = ['8', '7', '6', '5', '4', '3', '2', '1'];

        function handleModeChange() {
            if (modeSelect.value === 'bot') {
                p2Input.disabled = true;
                p2Input.value = "Robô (IA)";
                difficultyGroup.style.display = 'flex';
            } else {
                p2Input.disabled = false;
                p2Input.value = "Jogador 2";
                difficultyGroup.style.display = 'none';
            }
        }

        function startGame() {
            humanColor = colorSelect.value;
            p1Name = p1Input.value.trim() || "Jogador 1";
            
            if (modeSelect.value === 'bot') {
                const diffNames = { easy: "Fácil", medium: "Médio", hard: "Difícil" };
                p2Name = `Robô (${diffNames[difficultySelect.value]})`;
            } else {
                p2Name = p2Input.value.trim() || "Jogador 2";
            }

            const p1Icon = humanColor === 'w' ? '⚪' : '⚫';
            const p2Icon = humanColor === 'w' ? '⚫' : '⚪';

            p1NameSpan.innerText = `${p1Icon} ${p1Name}`;
            p2NameSpan.innerText = `${p2Icon} ${p2Name}`;

            startScreen.style.display = 'none';
            gameScreen.style.display = 'flex';

            resetGame();
        }

        function goToMenu() {
            gameScreen.style.display = 'none';
            startScreen.style.display = 'flex';
        }

        function updateScores() {
            const board = chess.board();
            let currentWhiteMaterial = 0;
            let currentBlackMaterial = 0;

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const piece = board[r][c];
                    if (piece) {
                        const val = pieceValues[piece.type];
                        if (piece.color === 'w') currentWhiteMaterial += val;
                        else currentBlackMaterial += val;
                    }
                }
            }

            const whiteCapturedScore = 39 - currentBlackMaterial;
            const blackCapturedScore = 39 - currentWhiteMaterial;

            if (humanColor === 'w') {
                p1ScoreSpan.innerText = `${whiteCapturedScore} pts`;
                p2ScoreSpan.innerText = `${blackCapturedScore} pts`;
            } else {
                p1ScoreSpan.innerText = `${blackCapturedScore} pts`;
                p2ScoreSpan.innerText = `${whiteCapturedScore} pts`;
            }
        }

        function createBoard() {
            boardHtml.innerHTML = ''; 
            const boardState = chess.board();

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    square.classList.add('square');
                    
                    if ((r + c) % 2 === 0) {
                        square.classList.add('light');
                    } else {
                        square.classList.add('dark');
                    }
                    
                    const squareCoord = columns[c] + rows[r];
                    square.dataset.square = squareCoord;

                    if (lastMoveSquares.includes(squareCoord)) {
                        square.classList.add('last-move');
                    }
                    
                    const piece = boardState[r][c];
                    if (piece) {
                        const img = document.createElement('img');
                        img.src = pieceImages[piece.type][piece.color];
                        square.appendChild(img);
                    }
                    
                    square.addEventListener('click', handleSquareClick);
                    boardHtml.appendChild(square);
                }
            }
            updateScores();
            updateStatusText();
        }

        function highlightPossibleMoves(fromSquare) {
            clearHighlights();
            const moves = chess.moves({ square: fromSquare, verbose: true });
            
            moves.forEach(move => {
                const targetSquare = document.querySelector(`[data-square="${move.to}"]`);
                if (targetSquare) {
                    if (move.captured) {
                        targetSquare.classList.add('possible-capture');
                    } else {
                        targetSquare.classList.add('possible-move');
                    }
                }
            });
        }

        function clearHighlights() {
            document.querySelectorAll('.possible-move, .possible-capture').forEach(sq => {
                sq.classList.remove('possible-move', 'possible-capture');
            });
        }

        function handleSquareClick(event) {
            if (modeSelect.value === 'bot' && chess.turn() !== humanColor) return;

            const clickedSquare = event.currentTarget;
            const squareCoord = clickedSquare.dataset.square;
            
            if (selectedSquare) {
                const fromSquare = selectedSquare.dataset.square;
                
                if (fromSquare === squareCoord) {
                    selectedSquare.classList.remove('selected');
                    selectedSquare = null;
                    clearHighlights();
                    return;
                }

                const move = chess.move({
                    from: fromSquare,
                    to: squareCoord,
                    promotion: 'q'
                });

                if (move === null) {
                    const piece = chess.get(squareCoord);
                    if (piece && piece.color === chess.turn()) {
                        selectedSquare.classList.remove('selected');
                        selectedSquare = clickedSquare;
                        clickedSquare.classList.add('selected');
                        highlightPossibleMoves(squareCoord);
                    } else {
                        showTemporaryMessage("❌ Movimento ilegal!");
                        selectedSquare.classList.remove('selected');
                        selectedSquare = null;
                        clearHighlights();
                    }
                    return;
                }
                
                lastMoveSquares = [fromSquare, squareCoord];
                playMoveSound();
                selectedSquare = null;
                clearHighlights();
                createBoard();

                if (modeSelect.value === 'bot' && !chess.game_over()) {
                    setTimeout(makeBotMove, 600);
                }
                
            } else {
                const piece = chess.get(squareCoord);
                if (piece && piece.color === chess.turn()) {
                    selectedSquare = clickedSquare;
                    clickedSquare.classList.add('selected');
                    highlightPossibleMoves(squareCoord);
                } else if (piece) {
                    const whitePlayerName = humanColor === 'w' ? p1Name : p2Name;
                    const blackPlayerName = humanColor === 'w' ? p2Name : p1Name;
                    const dono = chess.turn() === 'w' ? whitePlayerName : blackPlayerName;
                    showTemporaryMessage(`❌ É a vez de ${dono}!`);
                }
            }
        }

        function makeBotMove() {
            const possibleMoves = chess.moves({ verbose: true });
            if (possibleMoves.length === 0) return;

            let chosenMove = null;
            const difficulty = difficultySelect.value;

            if (difficulty === 'easy') {
                chosenMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
            } 
            else if (difficulty === 'medium') {
                const captureMoves = possibleMoves.filter(m => m.captured);
                if (captureMoves.length > 0) {
                    chosenMove = captureMoves[Math.floor(Math.random() * captureMoves.length)];
                } else {
                    chosenMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                }
            } 
            else if (difficulty === 'hard') {
                let bestScore = -9999;

                possibleMoves.forEach(move => {
                    let score = 0;
                    if (move.captured) {
                        score += (pieceValues[move.captured] * 10);
                    }
                    chess.move(move);
                    if (chess.in_check()) score += 5;
                    if (chess.in_checkmate()) score += 1000;
                    chess.undo();

                    if (score > bestScore) {
                        bestScore = score;
                        chosenMove = move;
                    }
                });

                if (!chosenMove) {
                    chosenMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                }
            }

            chess.move(chosenMove);
            lastMoveSquares = [chosenMove.from, chosenMove.to];
            playMoveSound();
            createBoard();
        }

        function updateStatusText() {
            p1Div.classList.remove('active-player');
            p2Div.classList.remove('active-player');

            const whitePlayerName = humanColor === 'w' ? p1Name : p2Name;
            const blackPlayerName = humanColor === 'w' ? p2Name : p1Name;

            if (chess.in_checkmate()) {
                statusBar.style.color = '#ff4757';
                const vencedor = chess.turn() === 'w' ? blackPlayerName : whitePlayerName;
                statusBar.innerText = `👑 XEQUE-MATE! Vitória de ${vencedor}!`;
                return;
            }
            
            if (chess.in_draw()) {
                statusBar.style.color = '#ccc';
                statusBar.innerText = "🤝 Jogo Empatado!";
                return;
            }

            const currentTurnColor = chess.turn();

            if ((humanColor === 'w' && currentTurnColor === 'w') || (humanColor === 'b' && currentTurnColor === 'b')) {
                p1Div.classList.add('active-player');
            } else {
                p2Div.classList.add('active-player');
            }

            statusBar.style.color = '#f1f2f6';

            if (modeSelect.value === 'bot' && currentTurnColor !== humanColor) {
                statusBar.innerText = "🤖 Robô pensando...";
            } else {
                const activeName = currentTurnColor === 'w' ? whitePlayerName : blackPlayerName;
                statusBar.innerText = chess.in_check() ? `⚠️ Rei em Xeque! Sua vez, ${activeName}` : `Sua vez, ${activeName}`;
            }
        }

        function showTemporaryMessage(msg) {
            statusBar.style.color = '#ff4757';
            statusBar.innerText = msg;
            setTimeout(updateStatusText, 1500);
        }

        function resetGame() {
            chess.reset();
            selectedSquare = null;
            lastMoveSquares = [];
            clearHighlights();
            createBoard();

            if (modeSelect.value === 'bot' && humanColor === 'b') {
                setTimeout(makeBotMove, 600);
            }
        }
    </script>
</body>
</html>
